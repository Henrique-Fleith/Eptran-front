<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
	<link rel="stylesheet" href="Register.css">

	<title>Template Eptran</title>
</head>


<body>
	<header id="header">
		<i class="fa-solid fa-bars" id="bar" onclick="collapse()"></i>
		<img src="img/epitrones.png" id="logo">
		<i class="fa-solid fa-user"></i>
	</header>

	<nav id="sideBar">
		<div>
			<a> Página Inicial </a> <br>
			<a> Pagina de Noticias </a> <br>
			<a> Conteudos </a> <br>
			<a> Quem somos Nós </a> <br>
			<a> </a> <br>
			<a> </a> <br>
			<a> </a> <br>
		</div>
	</nav>

	<div id="overlay" onclick="collapse()"></div>

	<div id="foca">
		<img src="img/planeta.png" id="planet">
		<img src="img/IMG_4532-removebg-preview (1).png" class="fa-bounce" id="car">
	</div>

	<div class="box">
		<form id="content" action="RegisterPassword.html" method="get">

			<h1>CADASTRO</h1>
			<div class="input">
				<label for="nome">Nome:</label>
				<input type="text">
			</div>
			<div class="input">
				<label for="nascimento">Data Nascimento:</label>
				<input type="date">
			</div>
			<div class="input">
				<label for="escola">Escola:</label>
				<input type="text">
			</div>

			<div class="input">
				<label for="etapa-escolar">Etapa escolar:</label>
				<select id="etapa-escolar">
					<option value="F1">Ensino Fundamental 1</option>
					<option value="F2">Ensino Fundamental 2</option>
					<option value="EM">Ensino Médio</option>
				</select>
			</div>
			<div class="input">
				<label for="cep" class="form-label">CEP:</label>
				<input type="text" id="cep" class="form-input" placeholder="00000-000" maxlength="9" required>
			</div>


			<div class="input">
				<label for="estado" class="form-label">UF:</label>
				<select id="estado" class="form-select" required>
					<option value="AC">AC</option>
					<option value="AL">AL</option>
					<option value="AP">AP</option>
					<option value="BA">BA</option>
					<option value="CE">CE</option>
					<option value="DF">DF</option>
					<option value="ES">ES</option>
					<option value="GO">GO</option>
					<option value="MA">MA</option>
					<option value="MT">MT</option>
					<option value="MS">MS</option>
					<option value="MG">MG</option>
					<option value="PA">PA</option>
					<option value="PB">PB</option>
					<option value="PR">PR</option>
					<option value="PE">PE</option>
					<option value="PI">PI</option>
					<option value="RJ">RJ</option>
					<option value="RN">RN</option>
					<option value="RS">RS</option>
					<option value="RO">RO</option>
					<option value="RR">RR</option>
					<option value="SC">SC</option>
					<option value="SP">SP</option>
					<option value="SE">SE</option>
					<option value="TO">TO</option>
				</select>
			</div>

			<div class="input">
				<label for="cidade" class="form-label">Cidade:</label>
				<input type="text" id="cidade" class="form-input" required>
			</div>


			<div class="input">
				<label for="bairro" class="form-label">Bairro:</label>
				<input type="text" id="bairro" class="form-input" required>
			</div>

			
				<button type="submit" id="send">Continuar</button>
				<br>
				<a href="../Login/Login.html" class="form-link">Já possuo uma conta</a>
				</form>
				</div>
	</div>


	<footer id="footer">
		<div>
			<img src="img/Joinvillers.png">
		</div>

		<div>
			<a>
				Informações de Contato <br>
				<hr style="color: white;">
				R. Caçador, 112 - Atiradores, Joinville - SC, 89203-610 <br>
				(47) 99121-0089 <br>
				detrans.uet@joinville.sc.gov.br
			</a>
		</div>

		<div>
			<a id="aSocial">
				Redes Sociais <br>
				<hr style="color: white;">
				<i class="fa-brands fa-instagram" style="font-size: 16px; margin: 6px;"></i>Instagram<br>
				<i class="fa-brands fa-square-facebook" style="font-size: 16px; margin: 6px;"></i>Facebook <br>
				<i class="fa-brands fa-youtube" style="font-size: 14px; margin: 6px;"></i>YouTube <br>
			</a>
		</div>

	</footer>

	<script src="Template.js"></script>
	<script src="cep-search.js"></script>
</body>

</html>
